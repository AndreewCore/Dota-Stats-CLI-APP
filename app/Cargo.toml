[package]
name = "dota-stats-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# Explicit binary name: without the Tauri bundler (we package via PKGBUILD),
# the executable would otherwise inherit the package name `dota-stats-app`.
[[bin]]
name = "dota-stats"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dota-stats-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
